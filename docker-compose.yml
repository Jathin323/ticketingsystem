services:
  backend:
    build: ./backend
    environment:
      - PORT=4000
      - DB_PATH=/app/data/data.sqlite
    volumes:
      - ticket-data:/app/data
    ports:
      - "4000:4000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  ticket-data:
